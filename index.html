<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><title>Для тебе ❤️</title><style>body{font-family:system-ui,sans-serif;background:#0e0e0f;color:#f7f2e8;max-width:620px;margin:auto;padding:40px 22px;line-height:1.6}.box{border:1px solid #444;border-radius:24px;padding:28px;margin-top:28px}h1{font-size:28px}button{padding:14px 18px;background:#f7f2e8;color:#111;border:0;border-radius:12px;font-size:16px;font-weight:bold}</style></head><body><div class="box"><h1>Для тебе ❤️</h1><p id="status" role="status">Відкриваю твоє послання…</p><button id="retry" hidden onclick="location.reload()">Спробувати ще раз</button></div><script>
const routes={"caa32e9f55e8": "stage-caa32e9f55e8.bin", "7acdc77ca19f": "stage-7acdc77ca19f.bin", "20372a034f0c": "stage-20372a034f0c.bin", "b88db63ac8ed": "stage-b88db63ac8ed.bin"};
async function openStage(){
 const p=new URLSearchParams(location.hash.slice(1)),file=routes[p.get('s')],k=p.get('k');
 if(!file||!k){document.getElementById('status').textContent='Відскануй QR-код на своїй картці. У ньому є ключ до послання.';return;}
 try{
  const raw=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-k.length%4)%4)),c=>c.charCodeAt(0));
  const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const response=await fetch(file,{cache:"no-store"});if(!response.ok)throw Error('network');
  const data=new Uint8Array(await response.arrayBuffer());
  const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:data.slice(0,12)},key,data.slice(12));
  const html=new TextDecoder().decode(plain);
  document.open();document.write(html);document.close();
 }catch(e){document.getElementById('status').textContent='Не вдалося відкрити послання. Перевір інтернет і відскануй повний QR-код ще раз.';document.getElementById('retry').hidden=false;}
}
window.addEventListener('hashchange',()=>location.reload());openStage();
</script></body></html>
