<!doctype html>
<html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#351e31"><title>Для тебе, Варю ♡</title>
<style>
:root{color-scheme:light;--ink:#351e31;--muted:#806675;--accent:#a64b65;--paper:#fffaf4}*{box-sizing:border-box}body{margin:0;color:var(--ink);background:#f4e8e3;font-family:Georgia,'Times New Roman',serif;min-height:100svh}body:before{content:'';position:fixed;inset:0;pointer-events:none;background:radial-gradient(ellipse at 10% 10%,#eec7bf88,transparent 50%),radial-gradient(ellipse at 90% 90%,#dcc6d988,transparent 50%)}main{position:relative;width:min(100% - 36px,540px);margin:0 auto;padding:32px 0 28px}header{display:flex;justify-content:space-between;align-items:center;font:10px/1.5 Arial,sans-serif;letter-spacing:2.2px;text-transform:uppercase;padding:0 6px 23px}header span:last-child{letter-spacing:1.2px}article{background:var(--paper);border:1px solid #d9bfc5;padding:38px 29px 32px;box-shadow:0 20px 65px #55334812;position:relative;border-radius:120px 120px 8px 8px;text-align:center;min-height:520px}.emblem{width:82px;height:82px;display:grid;place-items:center;border:1px solid #ddc0c7;border-radius:50%;margin:0 auto 28px;color:var(--accent);font:42px Georgia}svg{width:48px;height:48px;stroke:currentColor;fill:none;stroke-width:1.3}.eyebrow{font:10px/1.6 Arial,sans-serif;letter-spacing:2.8px;text-transform:uppercase;color:var(--accent);margin:0 0 15px}h1{font-weight:normal;font-size:clamp(32px,8vw,45px);line-height:1.1;letter-spacing:-1.4px;margin:0 0 25px}p{font-size:17px;line-height:1.75;margin:0 0 17px}.note{padding:20px 0 0;margin-top:24px;border-top:1px solid #e2cfd0;color:var(--accent);font-style:italic}.sign{margin:26px 0 0;font-style:italic;color:var(--muted);font-size:15px}footer{font:10px/1.7 Arial,sans-serif;letter-spacing:2px;text-align:center;color:var(--muted);padding-top:23px}.ticket{text-align:left;background:#f3e5df;border-top:1px dashed #c6a4ac;border-bottom:1px dashed #c6a4ac;padding:19px;margin:25px -6px}.ticket div{display:flex;justify-content:space-between;gap:15px;margin:10px 0;font:13px/1.5 Arial,sans-serif}.ticket span{color:var(--muted)}.ticket strong{font-weight:normal;text-align:right}.button{display:inline-block;border:0;border-radius:5px;background:var(--ink);color:var(--paper);padding:17px 23px;font:15px/1.3 Arial,sans-serif;text-decoration:none;cursor:pointer;margin-top:14px;min-height:52px}.button:focus-visible{outline:3px solid var(--accent);outline-offset:4px}.button:disabled{opacity:.6;cursor:wait}#status{font:13px/1.6 Arial,sans-serif;margin-top:16px;color:var(--muted)}#gift{margin-top:25px}#gift h2{font:26px/1.3 Georgia;margin-bottom:10px}.hidden{display:none!important}@media(min-width:600px){main{padding-top:50px}article{padding:45px 48px 38px}}@media(prefers-reduced-motion:no-preference){article{animation:appear .65s ease-out}@keyframes appear{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}}
</style></head><body><main><header><span>Для тебе, Варю</span><span>18 · 10 · 2026</span></header><article><div class="emblem" id="icon" aria-hidden="true">♡</div><div id="content"></div><p class="sign">З любов’ю, твій Руслан ♡</p></article><footer>НАШІ МІСЦЯ ЩАСЛИВИХ ЛЮДЕЙ</footer></main>
<script>
window.addEventListener('hashchange',()=>location.reload());
const ids=["fde1479a19", "f1cd919a74", "ee9ecf7f61", "85cc2ce4b2", "e4998185b5"];
const pages=[
`<div class="eyebrow">01 / Маленький початок</div><h1>З днем народження,<br>моя Варю.</h1><p>Загадай бажання. Сьогодні можна все — особливо мріяти сміливо.</p><p>Я хочу, щоб цей день був наповнений твоєю усмішкою, нашими обіймами й маленькими несподіванками.</p><p>І ця — тільки перша.</p><p class="note">А зараз — торт, обійми й солодкі сни.<br>Наступний сюрприз чекатиме вранці ♡</p>`,
`<div class="eyebrow">02 / Ранок для тебе</div><h1>Доброго ранку,<br>моя любов.</h1><p>Нехай сьогодні квіти будуть ще красивішими, обійми — довшими, а приводів усміхатися стане трохи більше.</p><p>Люблю твій сміх, твою ніжність і те, як поруч із тобою звичайні моменти стають нашими.</p><p class="note">Залиши трішки місця для пригоди.<br>Сьогодні ми зустрінемо вечір по-особливому.<br>Наступну підказку я передам тобі вдень ♡</p>`,
`<div class="eyebrow">03 / Boarding pass</div><h1>Двоє.<br>Один захід сонця.</h1><p>Це твоє запрошення на прогулянку човном. Тільки уяви: вода, вечірнє небо й ми поруч.</p><div class="ticket"><div><span>ПАСАЖИРКА</span><strong>Моя Варя ♡</strong></div><div><span>ДАТА</span><strong>18 жовтня 2026</strong></div><div><span>МАРШРУТ</span><strong>Назустріч заходу сонця</strong></div><div><span>ТВІЙ СУПУТНИК</span><strong>Я. Звісно ж, я.</strong></div></div><p>Візьми щось тепле — на воді може бути прохолодно. А час і дорогу я підкажу особисто.</p><p class="note">Наступна підказка чекатиме на човні ♡</p>`,
`<div class="eyebrow">04 / Мить, яку хочеться зберегти</div><h1>Ще одне<br>наше місце.</h1><p>Хочу, щоб у нас було ще багато таких моментів: коли нікуди не треба поспішати й достатньо просто бути разом.</p><p>Дякую тобі за цей день. За сміх. За пригоди. За нас.</p><p class="note">Але це ще не фінал…<br>Коли повернемося в готель, зазирни під свою подушку.<br>Там чекає остання підказка ♡</p>`,
`<div class="eyebrow">05 / Для твоєї мрії</div><h1>Ну що, думала<br>це фінал?</h1><p>Моя Варю, я хочу, щоб у твоєму житті було ще більше того, від чого горять очі.</p><p>Нових вражень. Сміливих мрій. І моментів, коли ти відчуваєш: це саме твоє.</p><p>З днем народження, моя любов.<br>Цей сюрприз — для тебе ♡</p><button class="button" id="reveal" type="button">Відкривай ♡</button><p id="status" role="status" aria-live="polite"></p><section id="gift" class="hidden"><div class="eyebrow">Твоя наступна пригода</div><h2 id="gift-title"></h2><p id="gift-subtitle"></p><p id="gift-pass"></p><a class="button" id="ticket-open" target="_blank" rel="noopener">Відкрити квиток ↗</a><br><a class="button" id="ticket-save" download="Varya-dance-camp-ticket.pdf">Зберегти PDF ↓</a><p class="note">Танцюй. Сяй. Будь собою.<br>Я люблю тебе ♡</p></section>`];
const params=new URLSearchParams(location.hash.slice(1));const step=ids.indexOf(params.get('s'));let blobURL;
document.getElementById('content').innerHTML=step<0?'<div class="eyebrow">Маленька пригода</div><h1>У кожного сюрпризу<br>свій момент.</h1><p>Відскануй QR-код на своїй листівці, щоб відкрити послання ♡</p>':pages[step];
if(step===2||step===3)document.getElementById('icon').innerHTML='<svg viewBox="0 0 50 50"><path d="M8 32h34l-7 9H17zM25 8v24M25 9L10 27h15M29 15l10 12H29M5 45q5-4 10 0t10 0t10 0t10 0"/></svg>';
if(step===4){document.getElementById('reveal').addEventListener('click',async()=>{const b=document.getElementById('reveal'),s=document.getElementById('status');b.disabled=true;s.textContent='Відкриваю твій сюрприз…';try{const k=params.get('k');if(!k)throw Error('key');const raw=Uint8Array.from(atob(k.replace(/-/g,'+').replace(/_/g,'/')+'='.repeat((4-k.length%4)%4)),c=>c.charCodeAt(0));const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const res=await fetch('gift.bin');if(!res.ok)throw Error('network');const bytes=new Uint8Array(await res.arrayBuffer());const decrypted=await crypto.subtle.decrypt({name:'AES-GCM',iv:bytes.slice(0,12)},key,bytes.slice(12));const gift=JSON.parse(new TextDecoder().decode(decrypted));document.getElementById('gift-title').textContent=gift.title;document.getElementById('gift-subtitle').textContent=gift.subtitle;document.getElementById('gift-pass').textContent=gift.pass;blobURL=URL.createObjectURL(new Blob([Uint8Array.from(atob(gift.pdf),c=>c.charCodeAt(0))],{type:'application/pdf'}));document.getElementById('ticket-open').href=blobURL;document.getElementById('ticket-save').href=blobURL;document.getElementById('gift').classList.remove('hidden');b.classList.add('hidden');s.textContent='Твій подарунок відкрито ♡';document.getElementById('gift').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'instant':'smooth',block:'center'});}catch(e){s.textContent=params.get('k')?'Не вдалося відкрити подарунок. Перевір інтернет і спробуй ще раз.':'Відскануй фінальний QR-код з листівки під подушкою — у ньому є ключ до подарунка.';b.disabled=false;}});}
</script></body></html>
